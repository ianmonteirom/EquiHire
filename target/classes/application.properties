# ==============================
# Configura��o Banco de Dados H2 (em mem�ria)
# ==============================
spring.datasource.url=jdbc:h2:mem:equihire;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=ian
spring.datasource.password=123255

# ==============================
# Configura��es JPA / Hibernate
# ==============================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.hbm2ddl.import_files=import.sql
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==============================
# Console H2
# ==============================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==============================
# Desabilitando inicializa��o autom�tica do script SQL
spring.sql.init.enabled=false
# ==============================
