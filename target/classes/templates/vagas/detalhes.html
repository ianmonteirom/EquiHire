<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Detalhes da Vaga</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
<div th:replace="~{layout :: header}"></div>

<main class="container py-4">
    <div class="card shadow-sm">
        <div class="card-body">
            <h5 class="card-title" th:text="${vaga.titulo}">Detalhes da Vaga</h5>

            <dl class="row">
                <dt class="col-sm-3">ID</dt>
                <dd class="col-sm-9" th:text="${vaga.id}">1</dd>

                <dt class="col-sm-3">Descrição</dt>
                <dd class="col-sm-9" th:text="${vaga.descricao}">Descrição completa da vaga futura.</dd>

                <dt class="col-sm-3">Nível</dt>
                <dd class="col-sm-9" th:text="${vaga.nivel}">ESPECIALISTA</dd>

                <dt class="col-sm-3">Área de Atuação</dt>
                <dd class="col-sm-9" th:text="${vaga.areaAtuacao}">Inteligência Artificial</dd>

                <dt class="col-sm-3">Carga Horária (h/sem)</dt>
                <dd class="col-sm-9" th:text="${vaga.cargaHorariaSemanal}">40</dd>

                <dt class="col-sm-3">Remota</dt>
                <dd class="col-sm-9"><span th:text="${vaga.remota} ? 'Sim' : 'Não'">Sim</span></dd>

                <dt class="col-sm-3">Criado em</dt>
                <dd class="col-sm-9" th:text="${#temporals.format(vaga.criadoEm, 'dd/MM/yyyy HH:mm')}">Now</dd>

                <dt class="col-sm-3">Atualizado em</dt>
                <dd class="col-sm-9" th:text="${#temporals.format(vaga.atualizadoEm, 'dd/MM/yyyy HH:mm')}">Now</dd>
            </dl>

            <div class="d-flex gap-2">
                <a class="btn btn-outline-secondary" th:href="@{|/vagas/${vaga.id}/editar|}">Editar</a>
                <a class="btn btn-secondary" th:href="@{/vagas}">Voltar</a>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
