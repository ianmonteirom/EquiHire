<!DOCTYPE html>

<footer class="py-3 border-top bg-white" th:fragment="footer">

        <span class="text-muted small">EquiHire • Global Solution 2025</span>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
