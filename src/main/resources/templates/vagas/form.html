<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${vaga.id} != null ? 'Editar Vaga' : 'Nova Vaga'">Vaga</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
<div th:replace="~{layout :: header}"></div>

<main class="container py-4">
    <div th:replace="~{fragments/_messages :: messagesFrag}"></div>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title" th:text="${vaga.id} != null ? 'Editar Vaga' : 'Nova Vaga'">Form</h5>

                    <form th:action="${vaga.id} != null ? @{'/vagas/' + ${vaga.id}} : @{/vagas}"
                          method="post" th:object="${vaga}" novalidate>

                        <div class="mb-3">
                            <label class="form-label">Título da Vaga</label>
                            <input type="text" th:field="*{titulo}" class="form-control" placeholder="Ex.: Especialista em Ética de IA">
                            <div class="text-danger small" th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}">Erro</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Descrição</label>
                            <textarea th:field="*{descricao}" class="form-control" rows="3" placeholder="Detalhes sobre a função e requisitos..."></textarea>
                            <div class="text-danger small" th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}">Erro</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Nível de Carreira</label>
                            <select th:field="*{nivel}" class="form-select">
                                <option value="">Selecione o Nível</option>
                                <option th:each="nivel : ${T(br.com.equihire.model.enums.NivelCarreira).values()}"
                                        th:value="${nivel}" th:text="${nivel}"></option>
                            </select>
                            <div class="text-danger small" th:if="${#fields.hasErrors('nivel')}" th:errors="*{nivel}">Erro</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Área de Atuação</label>
                            <input type="text" th:field="*{areaAtuacao}" class="form-control" placeholder="Ex.: TI, ESG, Data Science">
                            <div class="text-danger small" th:if="${#fields.hasErrors('areaAtuacao')}" th:errors="*{areaAtuacao}">Erro</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Carga Horária Semanal (horas)</label>
                            <input type="number" th:field="*{cargaHorariaSemanal}" class="form-control" placeholder="Ex.: 40">
                            <div class="text-danger small" th:if="${#fields.hasErrors('cargaHorariaSemanal')}" th:errors="*{cargaHorariaSemanal}">Erro</div>
                        </div>

                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" th:field="*{remota}" id="remotaSwitch">
                            <label class="form-check-label" for="remotaSwitch">Remota</label>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Salvar</button>
                            <a th:href="@{/vagas}" class="btn btn-outline-secondary">Voltar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
