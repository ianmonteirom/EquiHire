<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Detalhes do Candidato</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
<div th:replace="~{layout :: header}"></div>

<main class="container py-4">
    <div class="card shadow-sm">
        <div class="card-body">
            <h5 class="card-title" th:text="${candidato.nome}">Detalhes do Candidato</h5>

            <dl class="row">
                <dt class="col-sm-3">ID</dt>
                <dd class="col-sm-9" th:text="${candidato.id}">1</dd>

                <dt class="col-sm-3">Nome Completo</dt>
                <dd class="col-sm-9" th:text="${candidato.nome}">Nome do Candidato</dd>

                <dt class="col-sm-3">Email</dt>
                <dd class="col-sm-9" th:text="${candidato.email}">email@exemplo.com</dd>

                <dt class="col-sm-3">Área de Atuação</dt>
                <dd class="col-sm-9" th:text="${candidato.areaAtuacao}">TI/Dados</dd>

                <dt class="col-sm-3">Nível de Carreira</dt>
                <dd class="col-sm-9" th:text="${candidato.nivelCarreira}">Pleno</dd>

                <dt class="col-sm-3">Resumo</dt>
                <dd class="col-sm-9" th:text="${candidato.resumoExperiencia} ?: 'Não informado'"></dd>

                <dt class="col-sm-3">Cadastrado em</dt>
                <dd class="col-sm-9" th:text="${#temporals.format(candidato.dataCadastro, 'dd/MM/yyyy HH:mm')}">Now</dd>

                <dt class="col-sm-3">Atualizado em</dt>
                <dd class="col-sm-9" th:text="${#temporals.format(candidato.atualizadoEm, 'dd/MM/yyyy HH:mm')}">Now</dd>
            </dl>

            <div class="d-flex gap-2">
                <a class="btn btn-outline-secondary" th:href="@{|/candidatos/${candidato.id}/editar|}">Editar</a>
                <a class="btn btn-secondary" th:href="@{/candidatos}">Voltar</a>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
