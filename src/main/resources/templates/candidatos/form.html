<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${candidato.id} != null ? 'Editar Candidato' : 'Novo Candidato'">Candidato</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
<div th:replace="~{layout :: header}"></div>

<main class="container py-4">
    <div th:replace="~{fragments/_messages :: messagesFrag}"></div>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title" th:text="${candidato.id} != null ? 'Editar Candidato' : 'Novo Candidato'">Form</h5>

                    <form th:action="${candidato.id} != null ? @{'/candidatos/' + ${candidato.id}} : @{/candidatos}"
                          method="post" th:object="${candidato}" novalidate>

                        <div class="mb-3">
                            <label class="form-label">Nome Completo *</label>
                            <input type="text" th:field="*{nome}" class="form-control" placeholder="Ex.: Maria da Silva" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}">Erro</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email *</label>
                            <input type="email" th:field="*{email}" class="form-control" placeholder="Ex.: maria@exemplo.com" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Erro</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Área de Atuação *</label>
                            <input type="text" th:field="*{areaAtuacao}" class="form-control" placeholder="Ex.: Análise de Dados, UX Design" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('areaAtuacao')}" th:errors="*{areaAtuacao}">Erro</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Nível de Carreira</label>
                            <input type="text" th:field="*{nivelCarreira}" class="form-control" placeholder="Ex.: Júnior, Pleno, Sênior">
                            <div class="text-danger small" th:if="${#fields.hasErrors('nivelCarreira')}" th:errors="*{nivelCarreira}">Erro</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Resumo de Experiência</label>
                            <textarea th:field="*{resumoExperiencia}" class="form-control" rows="3" placeholder="Breve resumo das principais competências..."></textarea>
                            <div class="text-danger small" th:if="${#fields.hasErrors('resumoExperiencia')}" th:errors="*{resumoExperiencia}">Erro</div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Salvar</button>
                            <a th:href="@{/candidatos}" class="btn btn-outline-secondary">Voltar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
